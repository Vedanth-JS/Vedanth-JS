<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" /> <!-- Purple -->
      <stop offset="100%" stop-color="#38bdf8" /> <!-- Cyan -->
    </linearGradient>

    <!-- Border Gradient for Badges -->
    <linearGradient id="border-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2"/>
    </linearGradient>
    
    <linearGradient id="border-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="border-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Slash Line Gradient -->
    <linearGradient id="slash-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <!-- Blue Background Glow -->
    <radialGradient id="blue-glow" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="300" fill="url(#bg-grad)" rx="12" />
  <rect width="850" height="300" fill="url(#blue-glow)" rx="12" />
  <rect width="850" height="300" fill="url(#grid)" rx="12" />

  <!-- Diagonal Separator/Slash -->
  <line x1="330" y1="20" x2="305" y2="280" stroke="url(#slash-grad)" stroke-width="2" />

  <!-- Faint Background Brackets -->
  <text x="385" y="165" font-family="'Segoe UI', system-ui, sans-serif" font-weight="300" font-size="70" fill="#38bdf8" opacity="0.12" text-anchor="middle">&lt;</text>
  <text x="425" y="170" font-family="'Segoe UI', system-ui, sans-serif" font-weight="300" font-size="50" fill="#a78bfa" opacity="0.08" text-anchor="middle">/</text>
  <text x="425" y="165" font-family="'Segoe UI', system-ui, sans-serif" font-weight="300" font-size="70" fill="#a78bfa" opacity="0.12" text-anchor="middle">&gt;</text>

  <!-- ================= LEFT COLUMN ================= -->
  
  <!-- Status Badge / Open to Internships -->
  <g transform="translate(50, 48)">
    <line x1="0" y1="0" x2="12" y2="0" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="4" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="9.5" fill="#38bdf8" letter-spacing="2">OPEN TO INTERNSHIPS</text>
  </g>

  <!-- Name: VEDANTH J S -->
  <text x="50" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="48" fill="#ffffff" letter-spacing="2">VEDANTH</text>
  <text x="50" y="165" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="48" fill="url(#text-grad)" letter-spacing="2" filter="url(#soft-glow)">J S</text>

  <!-- Title/Role -->
  <text x="50" y="210" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="16.5" fill="#cbd5e1" letter-spacing="0.5">Full-Stack Engineer / AI-ML</text>

  <!-- Social / Links -->
  <g transform="translate(50, 246)">
    <!-- Active Green Dot -->
    <circle cx="5" cy="-4" r="2.5" fill="#10b981" filter="url(#soft-glow)" />
    <text x="14" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="10.5" fill="#64748b" letter-spacing="0.5">github.com/Vedanth-</text>
    <text x="14" y="12" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="9.5" fill="#cbd5e1" letter-spacing="0.5">JS</text>

    <text x="140" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="10.5" fill="#64748b" letter-spacing="0.5">linkedin.com/in/vedanth-j-</text>
    <text x="140" y="12" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="9.5" fill="#cbd5e1" letter-spacing="0.5">s</text>
  </g>


  <!-- ================= RIGHT COLUMN ================= -->

  <!-- Core Stack Section -->
  <g transform="translate(450, 85)">
    <!-- Header -->
    <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="9.5" fill="#64748b" letter-spacing="2">CORE STACK</text>

    <!-- Badge Row 1 -->
    <g transform="translate(0, 12)">
      <!-- React -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="55" height="24" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="url(#border-blue)" stroke-width="1" />
        <text x="27.5" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#93c5fd" text-anchor="middle">React</text>
      </g>
      <!-- Node.js -->
      <g transform="translate(63, 0)">
        <rect x="0" y="0" width="65" height="24" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="url(#border-purple)" stroke-width="1" />
        <text x="32.5" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#c084fc" text-anchor="middle">Node.js</text>
      </g>
      <!-- FastAPI -->
      <g transform="translate(136, 0)">
        <rect x="0" y="0" width="65" height="24" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="url(#border-blue)" stroke-width="1" />
        <text x="32.5" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#93c5fd" text-anchor="middle">FastAPI</text>
      </g>
      <!-- Spring Boot -->
      <g transform="translate(209, 0)">
        <rect x="0" y="0" width="85" height="24" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="url(#border-slate)" stroke-width="1" />
        <text x="42.5" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#94a3b8" text-anchor="middle">Spring Boot</text>
      </g>
    </g>

    <!-- Badge Row 2 -->
    <g transform="translate(0, 46)">
      <!-- PostgreSQL -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="80" height="24" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="url(#border-slate)" stroke-width="1" />
        <text x="40" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#94a3b8" text-anchor="middle">PostgreSQL</text>
      </g>
      <!-- TensorFlow.js -->
      <g transform="translate(88, 0)">
        <rect x="0" y="0" width="98" height="24" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="url(#border-purple)" stroke-width="1" />
        <text x="49" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#c084fc" text-anchor="middle">TensorFlow.js</text>
      </g>
      <!-- Python -->
      <g transform="translate(194, 0)">
        <rect x="0" y="0" width="60" height="24" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="url(#border-slate)" stroke-width="1" />
        <text x="30" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#94a3b8" text-anchor="middle">Python</text>
      </g>
      <!-- Java -->
      <g transform="translate(262, 0)">
        <rect x="0" y="0" width="45" height="24" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="url(#border-slate)" stroke-width="1" />
        <text x="22.5" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#94a3b8" text-anchor="middle">Java</text>
      </g>
    </g>

    <!-- Separator Line -->
    <line x1="0" y1="90" x2="350" y2="90" stroke="#1e293b" stroke-width="1.2" opacity="0.6" />

    <!-- College Info / Bottom details -->
    <g transform="translate(0, 108)">
      <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="10.5" fill="#64748b" letter-spacing="0.5">Siddaganga Institute of Technology ·</text>
      <text x="0" y="13" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="9" fill="#475569" letter-spacing="1">CSE 2028</text>

      <text x="220" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="10.5" fill="#64748b" letter-spacing="0.5">Building real-time &amp; AI-powered</text>
      <text x="220" y="13" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="10.5" fill="#64748b" letter-spacing="0.5">systems</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <!-- Definition of gradients and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa" />
      <stop offset="100%" stop-color="#eaeef2" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" /> <!-- Rich Blue -->
      <stop offset="50%" stop-color="#7c3aed" /> <!-- Purple -->
      <stop offset="100%" stop-color="#db2777" /> <!-- Pink -->
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="pink-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#d0d7de" stroke-width="0.7" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="850" height="300" fill="url(#bg-grad)" rx="15" />
  
  <!-- Ambient Glow Elements -->
  <circle cx="100" cy="50" r="180" fill="url(#cyan-grad)" />
  <circle cx="750" cy="250" r="200" fill="url(#pink-grad)" />

  <!-- Grid overlay -->
  <rect width="850" height="300" fill="url(#grid)" rx="15" />

  <!-- Decorative Abstract Tech Waves -->
  <!-- Wave 1 -->
  <path d="M-50 200 C 150 120, 300 280, 500 160 C 650 70, 750 220, 900 180" fill="none" stroke="url(#primary-grad)" stroke-width="2" opacity="0.18" />
  <!-- Wave 2 -->
  <path d="M-50 215 C 170 145, 280 295, 480 185 C 630 100, 760 235, 900 200" fill="none" stroke="url(#primary-grad)" stroke-width="1" opacity="0.12" />

  <!-- Floating Tech Constellations -->
  <g opacity="0.5">
    <line x1="80" y1="220" x2="150" y2="180" stroke="#0284c7" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="150" y1="180" x2="220" y2="230" stroke="#0284c7" stroke-width="0.5" stroke-dasharray="2 2" />
    <circle cx="80" cy="220" r="3" fill="#0284c7" />
    <circle cx="150" cy="180" r="4" fill="#7c3aed" />
    <circle cx="220" cy="230" r="3" fill="#db2777" />

    <line x1="630" y1="70" x2="700" y2="120" stroke="#db2777" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="700" y1="120" x2="770" y2="60" stroke="#db2777" stroke-width="0.5" stroke-dasharray="2 2" />
    <circle cx="630" cy="70" r="3" fill="#7c3aed" />
    <circle cx="700" cy="120" r="4" fill="#db2777" />
    <circle cx="770" cy="60" r="3" fill="#0284c7" />
  </g>

  <!-- Top/Bottom decorative lines -->
  <rect x="50" y="25" width="750" height="2" fill="url(#primary-grad)" opacity="0.5" />
  <!-- Bottom decorative line -->
  <rect x="50" y="273" width="750" height="2" fill="url(#primary-grad)" opacity="0.5" />

  <!-- Main Content Layout (Centered) -->
  <g>
    <!-- Decorative brackets -->
    <text x="110" y="145" font-family="'Segoe UI', system-ui, sans-serif" font-weight="300" font-size="52" fill="#0284c7" opacity="0.25" text-anchor="middle">&lt;</text>
    <text x="740" y="145" font-family="'Segoe UI', system-ui, sans-serif" font-weight="300" font-size="52" fill="#db2777" opacity="0.25" text-anchor="middle">/&gt;</text>

    <!-- Main Title -->
    <text x="425" y="130" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="44" fill="#1f2328" letter-spacing="4" text-anchor="middle">
      VEDANTH J S
    </text>
    <!-- Accent line below name -->
    <rect x="285" y="145" width="280" height="4" rx="2" fill="url(#primary-grad)" />

    <!-- Subtitle / Role -->
    <text x="425" y="190" font-family="'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="18" fill="#57606a" letter-spacing="1" text-anchor="middle">
      Full Stack Software Engineer &amp; Designer
    </text>

    <!-- Dynamic Status Tags (Pills, Centered) -->
    <g transform="translate(238, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#eaeef2" stroke="#d0d7de" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#1a7f37" />
      <text x="27" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="11" fill="#57606a" letter-spacing="0.5">OPEN FOR COLLAB</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="105" height="26" rx="13" fill="#eaeef2" stroke="#d0d7de" stroke-width="1" />
      <text x="15" y="17" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#57606a">⚡</text>
      <text x="32" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="11" fill="#57606a" letter-spacing="0.5">BUILDING WEB3</text>

      <!-- Tag 3 -->
      <rect x="259" y="0" width="115" height="26" rx="13" fill="#eaeef2" stroke="#d0d7de" stroke-width="1" />
      <text x="15" y="17" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="12" fill="#57606a">🚀</text>
      <text x="32" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="11" fill="#57606a" letter-spacing="0.5">AI ENTHUSIAST</text>
    </g>
  </g>
</svg>
